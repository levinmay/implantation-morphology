[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implantation-embryo-pipeline"
version = "0.1.5"
description = "Whole-embryo masks and developmental characterization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==2.3.5", "pandas==2.3.3", "opencv-python-headless==4.13.0.90",
  "scikit-learn==1.7.2", "scipy==1.16.3", "scikit-image==0.26.0",
  "Pillow==12.1.1", "joblib>=1.4,<2",
]

[project.optional-dependencies]
segmentation = ["torch==2.4.1", "torchvision==0.19.1", "nnunetv2==2.6.4"]
sam = ["segment-anything==1.0"]

[project.scripts]
embryo-pipeline = "pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["feature_set.json"]
